name: Rollout Hop

on:
  workflow_call:
    inputs:
      blueprint_ref:
        type: string
        required: false
      pulumi_stack:
        type: string
        required: true
      aws_region:
        type: string
        required: true
      release_id:
        type: string
        required: true
      pulumi_backend_url:
        type: string
        required: true
      pulumi_secrets_provider:
        type: string
        required: true
      releases_repo:
        type: string
        required: false
        default: Lychee-Technology/ltbase-releases
      controlplane_ui_pages_project:
        type: string
        required: false
        default: ""
      cloudflare_account_id:
        type: string
        required: false
        default: ""
      controlplane_ui_runtime_config_json:
        type: string
        required: false
        default: ""
      controlplane_ui_artifact_name:
        type: string
        required: false
        default: controlplane-ui
      working_directory:
        type: string
        required: false
        default: infra
      infra_binaries_repo:
        type: string
        required: false
        default: Lychee-Technology/ltbase-private-deployment-binaries
      workflow_actions_ref:
        type: string
        required: false
        default: main
      run_canary:
        type: boolean
        required: false
        default: false
      refresh_after_apply:
        type: boolean
        required: false
        default: false
      reconcile_managed_dsql_endpoint:
        type: boolean
        required: false
        default: false
        description: >
          When true, reads dsqlClusterIdentifier from the stack output,
          calls aws dsql get-cluster to fetch the authoritative endpoint,
          and writes it back as pulumi config dsqlEndpoint before output
          capture and any CodeDeploy canary steps.
    secrets:
      aws_role_arn:
        required: true
      ltbase_releases_token:
        required: true
      cloudflare_api_token:
        required: true
    outputs:
      release_id:
        value: ${{ jobs.rollout.outputs.release_id }}
      manifest_path:
        value: ${{ jobs.rollout.outputs.manifest_path }}
      pulumi_stack:
        value: ${{ jobs.rollout.outputs.pulumi_stack }}
      deployment_outputs_json:
        value: ${{ jobs.rollout.outputs.deployment_outputs_json }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  rollout:
    runs-on: ubuntu-24.04-arm
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      manifest_path: ${{ steps.download.outputs.manifest_path }}
      pulumi_stack: ${{ steps.meta.outputs.pulumi_stack }}
      deployment_outputs_json: ${{ steps.outputs.outputs.deployment_outputs_json }}
    steps:
      - id: meta
        run: |
          echo "release_id=${{ inputs.release_id }}" >> "$GITHUB_OUTPUT"
          echo "pulumi_stack=${{ inputs.pulumi_stack }}" >> "$GITHUB_OUTPUT"
          echo "workflow_ref_name=${{ inputs.workflow_actions_ref }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          path: blueprint
          ref: ${{ inputs.blueprint_ref || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: Lychee-Technology/ltbase-deploy-workflows
          ref: ${{ steps.meta.outputs.workflow_ref_name }}
          path: .ltbase/workflow-repo
      - name: Install prebuilt infra binary
        id: prebuilt
        uses: ./.ltbase/workflow-repo/.github/actions/install-prebuilt-infra-binary
        with:
          binaries_repo: ${{ inputs.infra_binaries_repo }}
          provenance_path: blueprint/__ref__/template-provenance.json
          working_directory: blueprint/${{ inputs.working_directory }}
          token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - id: download
        uses: ./.ltbase/workflow-repo/.github/actions/download-private-release
        with:
          releases_repo: ${{ inputs.releases_repo }}
          release_id: ${{ inputs.release_id }}
          token: ${{ secrets.ltbase_releases_token }}
          output_root: blueprint/.ltbase/releases
      - uses: ./.ltbase/workflow-repo/.github/actions/setup-pulumi
        with:
          go_version_file: ${{ format('blueprint/{0}/go.mod', inputs.working_directory) }}
          cache_dependency_path: ${{ format('blueprint/{0}/go.sum', inputs.working_directory) }}
          pulumi_backend_url: ${{ inputs.pulumi_backend_url }}
          pulumi_stack: ${{ inputs.pulumi_stack }}
          pulumi_secrets_provider: ${{ inputs.pulumi_secrets_provider }}
          working_directory: blueprint/${{ inputs.working_directory }}
      - name: Set release id
        working-directory: blueprint/${{ inputs.working_directory }}
        run: |
          pulumi config set releaseAssetDir "$(pwd)/../.ltbase/releases" --stack "${{ inputs.pulumi_stack }}"
          pulumi config set releaseId "${{ inputs.release_id }}" --stack "${{ inputs.pulumi_stack }}"
      - name: Show Pulumi build environment
        working-directory: blueprint/${{ inputs.working_directory }}
        run: |
          date -u
          uname -a
          go version
          pulumi version
          go env GOMOD GOCACHE GOMODCACHE GOARCH GOOS
      - name: Deploy stack
        uses: ./.ltbase/workflow-repo/.github/actions/run-pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
          GOMAXPROCS: "2"
          GOMEMLIMIT: 3GiB
          GOGC: "50"
        with:
          working_directory: blueprint/${{ inputs.working_directory }}
          command: up
          stack: ${{ inputs.pulumi_stack }}
          prefer_wrapper: true
          wrapper_path: scripts/pulumi-wrapper.sh
      - name: Reconcile managed DSQL endpoint
        if: ${{ inputs.reconcile_managed_dsql_endpoint }}
        uses: ./.ltbase/workflow-repo/.github/actions/reconcile-managed-dsql-endpoint
        with:
          stack: ${{ inputs.pulumi_stack }}
          aws_region: ${{ inputs.aws_region }}
          working_directory: blueprint/${{ inputs.working_directory }}
      - name: Re-apply stack after managed DSQL reconcile
        if: ${{ inputs.reconcile_managed_dsql_endpoint }}
        uses: ./.ltbase/workflow-repo/.github/actions/run-pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
          GOMAXPROCS: "2"
          GOMEMLIMIT: 3GiB
          GOGC: "50"
        with:
          working_directory: blueprint/${{ inputs.working_directory }}
          command: up
          stack: ${{ inputs.pulumi_stack }}
          prefer_wrapper: true
          wrapper_path: scripts/pulumi-wrapper.sh
      - name: Reconcile project info
        uses: ./.ltbase/workflow-repo/.github/actions/reconcile-project-info
        with:
          stack: ${{ inputs.pulumi_stack }}
          aws_region: ${{ inputs.aws_region }}
          working_directory: blueprint/${{ inputs.working_directory }}
      - name: Capture deployment outputs
        working-directory: blueprint/${{ inputs.working_directory }}
        run: pulumi stack output --json --stack "${{ inputs.pulumi_stack }}" > /tmp/deployment-outputs.json
      - name: Run data plane canary
        if: ${{ inputs.run_canary }}
        uses: ./.ltbase/workflow-repo/.github/actions/run-codedeploy-canary
        with:
          outputs_json: /tmp/deployment-outputs.json
          current_key: dataPlaneCurrentVersion
          target_key: dataPlaneTargetVersion
          function_key: dataPlaneFunctionName
          alias_key: dataPlaneAliasName
          app_key: dataPlaneDeploymentAppName
          group_key: dataPlaneDeploymentGroupName
      - name: Run control plane canary
        if: ${{ inputs.run_canary }}
        uses: ./.ltbase/workflow-repo/.github/actions/run-codedeploy-canary
        with:
          outputs_json: /tmp/deployment-outputs.json
          current_key: controlPlaneCurrentVersion
          target_key: controlPlaneTargetVersion
          function_key: controlPlaneFunctionName
          alias_key: controlPlaneAliasName
          app_key: controlPlaneDeploymentAppName
          group_key: controlPlaneDeploymentGroupName
      - name: Run auth service canary
        if: ${{ inputs.run_canary }}
        uses: ./.ltbase/workflow-repo/.github/actions/run-codedeploy-canary
        with:
          outputs_json: /tmp/deployment-outputs.json
          current_key: authServiceCurrentVersion
          target_key: authServiceTargetVersion
          function_key: authServiceFunctionName
          alias_key: authServiceAliasName
          app_key: authServiceDeploymentAppName
          group_key: authServiceDeploymentGroupName
      - name: Refresh stack
        if: ${{ inputs.refresh_after_apply }}
        uses: ./.ltbase/workflow-repo/.github/actions/run-pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
          GOMAXPROCS: "2"
          GOMEMLIMIT: 3GiB
          GOGC: "50"
        with:
          working_directory: blueprint/${{ inputs.working_directory }}
          command: refresh
          stack: ${{ inputs.pulumi_stack }}
          prefer_wrapper: true
          wrapper_path: scripts/pulumi-wrapper.sh
      - name: Capture refreshed deployment outputs
        if: ${{ inputs.refresh_after_apply }}
        working-directory: blueprint/${{ inputs.working_directory }}
        run: pulumi stack output --json --stack "${{ inputs.pulumi_stack }}" > /tmp/deployment-outputs.json
      - name: Deploy control plane UI
        if: ${{ inputs.controlplane_ui_pages_project != '' && inputs.controlplane_ui_runtime_config_json != '' }}
        uses: ./.ltbase/workflow-repo/.github/actions/deploy-controlplane-ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare_api_token }}
        with:
          manifest_path: ${{ steps.download.outputs.manifest_path }}
          runtime_config_json: ${{ inputs.controlplane_ui_runtime_config_json }}
          cloudflare_pages_project: ${{ inputs.controlplane_ui_pages_project }}
          cloudflare_account_id: ${{ inputs.cloudflare_account_id }}
      - id: outputs
        run: |
          echo "deployment_outputs_json=$(jq -c '.' /tmp/deployment-outputs.json)" >> "$GITHUB_OUTPUT"
