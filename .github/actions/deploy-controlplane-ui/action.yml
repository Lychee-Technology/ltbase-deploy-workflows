name: Deploy Control Plane UI
description: Deploy the control plane UI release artifact to Cloudflare Pages

inputs:
  manifest_path:
    description: Path to the downloaded release manifest.json file
    required: true
  runtime_config_json:
    description: Runtime config JSON written into the deployed artifact
    required: true
  cloudflare_pages_project:
    description: Cloudflare Pages project name
    required: true
  cloudflare_account_id:
    description: Optional Cloudflare account id used by Wrangler account resolution
    required: false
    default: ""
  pages_branch:
    description: Optional Cloudflare Pages branch name
    required: false
    default: ""
  artifact_name:
    description: Manifest artifact name selector
    required: false
    default: controlplane-ui
  deploy_root:
    description: Optional unpack directory override
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Deploy control plane UI artifact
      shell: bash
      env:
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        INPUT_RUNTIME_CONFIG_JSON: ${{ inputs.runtime_config_json }}
        INPUT_CLOUDFLARE_PAGES_PROJECT: ${{ inputs.cloudflare_pages_project }}
        INPUT_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        INPUT_PAGES_BRANCH: ${{ inputs.pages_branch }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        INPUT_DEPLOY_ROOT: ${{ inputs.deploy_root }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
      run: |
        "${{ github.action_path }}/deploy.sh" \
          --manifest-path "${INPUT_MANIFEST_PATH}" \
          --runtime-config-json "${INPUT_RUNTIME_CONFIG_JSON}" \
          --cloudflare-pages-project "${INPUT_CLOUDFLARE_PAGES_PROJECT}" \
          --pages-branch "${INPUT_PAGES_BRANCH}" \
          --artifact-name "${INPUT_ARTIFACT_NAME}" \
          --deploy-root "${INPUT_DEPLOY_ROOT}"
