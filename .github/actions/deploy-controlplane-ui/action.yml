name: Deploy Control Plane UI
description: Deploy the control plane UI release artifact to Cloudflare Pages

inputs:
  manifest-path:
    description: Path to the downloaded release manifest.json file
    required: true
  runtime-config-json:
    description: Runtime config JSON written into the deployed artifact
    required: true
  cloudflare-pages-project:
    description: Cloudflare Pages project name
    required: true
  pages-branch:
    description: Optional Cloudflare Pages branch name
    required: false
    default: ""
  artifact-name:
    description: Manifest artifact name selector
    required: false
    default: controlplane-ui
  deploy-root:
    description: Optional unpack directory override
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Deploy control plane UI artifact
      shell: bash
      env:
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_RUNTIME_CONFIG_JSON: ${{ inputs.runtime-config-json }}
        INPUT_CLOUDFLARE_PAGES_PROJECT: ${{ inputs.cloudflare-pages-project }}
        INPUT_PAGES_BRANCH: ${{ inputs.pages-branch }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_DEPLOY_ROOT: ${{ inputs.deploy-root }}
      run: |
        "${{ github.action_path }}/deploy.sh" \
          --manifest-path "${INPUT_MANIFEST_PATH}" \
          --runtime-config-json "${INPUT_RUNTIME_CONFIG_JSON}" \
          --cloudflare-pages-project "${INPUT_CLOUDFLARE_PAGES_PROJECT}" \
          --pages-branch "${INPUT_PAGES_BRANCH}" \
          --artifact-name "${INPUT_ARTIFACT_NAME}" \
          --deploy-root "${INPUT_DEPLOY_ROOT}"
